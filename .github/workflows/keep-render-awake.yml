name: Keep Render awake

# Pings the public health endpoint so free-tier Render does not sleep.
# Note: GitHub cron can drift a few minutes; 14 min keeps us under the idle window.
on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health
        run: |
          URL="${{ secrets.RENDER_HEALTH_URL }}"
          if [ -z "$URL" ]; then
            URL="https://expense-tracker-backend-oucd.onrender.com/api/health"
          fi
          echo "Pinging $URL"
          curl -fsS --max-time 30 "$URL"
          echo
          echo "OK"
