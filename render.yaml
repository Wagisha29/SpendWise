services:
  - type: web
    name: expense-tracker-backend
    runtime: python
    rootDir: apps/backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      # Set in Render dashboard to:
      # http://localhost:5173,https://spendwise-io.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false
      # Google AI Studio key — backend only (never VITE_*)
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
